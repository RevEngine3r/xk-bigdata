name: Xray-Knife Tester

on:
  schedule:
    # Run every 7 days at 00:00 UTC on Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout all.txt from bd branch
        uses: actions/checkout@v4
        with:
          ref: bd
          sparse-checkout: |
            sub/all.txt
          sparse-checkout-cone-mode: false
          path: in-bd

      - name: Checkout g200.txt and gn200.txt from xk branch
        uses: actions/checkout@v4
        with:
          ref: xk
          sparse-checkout: |
            sub/g200.txt
            sub/gn200.txt
          sparse-checkout-cone-mode: false
          path: in-xk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create required directories
        run: |
          mkdir -p sub

      - name: Download and install xray-knife
        run: |
          wget -q https://github.com/lilendian0x00/xray-knife/releases/download/v11.3.0/Xray-knife-linux-64.zip -O /tmp/xray-knife.zip
          unzip -o /tmp/xray-knife.zip -d /tmp/xray-knife
          chmod +x /tmp/xray-knife/xray-knife
          cp /tmp/xray-knife/xray-knife ./xray-knife
          chmod +x ./xray-knife
          ./xray-knife --version || true

      - name: Step 1 - Merge subscription files
        run: |
          set -e

          # ------------------------------------------------------------
          # Merge all.txt, g200.txt, and gn200.txt into merged.txt
          # ------------------------------------------------------------
          echo "Merging subscription files into in/merged.txt..."

          # Ensure output dir exists (checkout already creates it, but be safe)
          mkdir -p in

          # Concatenate files, stripping CR and skipping empty lines
          : > in/merged.txt
          for f in in-bd/sub/all.txt in-xk/sub/g200.txt in-xk/sub/gn200.txt; do
            if [ -f "$f" ]; then
              echo "Appending: $f"
              tr -d '\r' < "$f" | sed '/^[[:space:]]*$/d' >> in/merged.txt
            else
              echo "Warning: $f not found, skipping."
            fi
          done

          echo ""
          echo "Done. Merged file: in/merged.txt"
          echo "Total lines: $(wc -l < in/merged.txt)"

      - name: Step 2 - Run HTTP test
        run: |
          set -e
          XRAY_KNIFE="./xray-knife"
          DB_PATH="db/xk.db"

          mkdir -p out

          "${XRAY_KNIFE}" --db "${DB_PATH}" http \
            --file in/merged.txt \
            --url "https://dl.google.com/android/repository/repository2-4.xml" \
            --dedup-semantic \
            --core auto \
            --insecure \
            --threads 50 \
            --mdelay 5000 \
            --retries 2 \
            --rip \
            --sort \
            --type json \
            --out out/results.json

          echo "Done."

      - name: Step 3 - Process results with xrayknife.py
        run: |
          set -e
          python xrayknife.py

      - name: Step 4 - Publish sub dir
        run: |
          set -e
          
          # List of files (relative paths) to publish
          FILES=(
            "sub/g200.txt"
            "sub/gn200.txt"
          )
          
          # Verify all expected files exist
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Error: expected output file is missing: $f"
              ls -la sub/ || true
              exit 1
            fi
          done
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stash files to /tmp, then remove from working tree
          TMPDIR_STAGE="$(mktemp -d)"
          for f in "${FILES[@]}"; do
            cp "$f" "$TMPDIR_STAGE/$(basename "$f")"
          done
          rm -f "${FILES[@]}"
          
          # Switch to (or create) the output branch
          if git ls-remote --exit-code --heads origin xk > /dev/null 2>&1; then
            git fetch origin xk
            git checkout xk
          else
            git checkout --orphan xk
            git rm -rf . > /dev/null 2>&1 || true
          fi
          
          mkdir -p sub
          
          # Restore files into the branch
          for f in "${FILES[@]}"; do
            cp "$TMPDIR_STAGE/$(basename "$f")" "$f"
          done
          
          git add "${FILES[@]}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update results $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin xk
          fi